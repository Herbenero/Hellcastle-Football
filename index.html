<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Darts</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #f97316;
      --danger: #ef4444;
      --shield: #3b82f6;
      --heal: #22c55e;
      --coin: #eab308;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1rem; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    
    h1, h2, h3 { text-align: center; margin-bottom: 1rem; }
    button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: all 0.2s; }
    input, select { background: #0f172a; color: var(--text); border: 1px solid var(--border); padding: 0.5rem; border-radius: 4px; }
    
    /* Setup Screen */
    .setup-card { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); }
    .input-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .player-inputs { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .player-input-row { display: flex; gap: 0.5rem; }
    .btn-primary { background: var(--accent); color: white; padding: 0.75rem 1.5rem; font-size: 1rem; width: 100%; border-radius: 8px; }
    .btn-secondary { background: var(--border); color: var(--text); padding: 0.5rem 1rem; }
    
    /* Game Layout */
    .hidden { display: none !important; }
    .banner { background: var(--heal); color: black; font-weight: bold; text-align: center; padding: 0.5rem; border-radius: 6px; margin-bottom: 1rem; text-transform: uppercase; }
    .coins-container { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .coin { background: rgba(234, 179, 8, 0.15); border: 2px dashed var(--coin); padding: 0.75rem 1rem; border-radius: 8px; text-align: center; cursor: pointer; animation: pulse 1.5s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(0.98); } 100% { transform: scale(1.02); } }

    /* Player Grid */
    .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .player-card { background: var(--card-bg); border-radius: 10px; padding: 1rem; border: 2px solid var(--border); position: relative; transition: all 0.3s; }
    
    /* Status Tints */
    .player-card.low-hp { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); }
    .player-card.active-turn { border-color: var(--accent) !important; box-shadow: 0 0 15px rgba(249, 115, 22, 0.6); }
    .player-card.eliminated { opacity: 0.4; filter: grayscale(1); }

    .badge { position: absolute; top: 10px; right: 10px; background: var(--accent); color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    
    .stats { display: flex; justify-content: space-between; margin: 0.5rem 0; font-size: 1.1rem; }
    .hp { color: #f87171; font-weight: bold; }
    .shield { color: #60a5fa; font-weight: bold; }
    .target-num { font-size: 0.9rem; color: var(--subtext); }

    /* Attacks/Heals Section */
    .actions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.3rem; margin-top: 0.5rem; }
    .actions-grid.has-quad { grid-template-columns: repeat(4, 1fr); }
    .btn-action { background: #334155; color: white; padding: 0.4rem; font-size: 0.8rem; border-radius: 4px; }
    .btn-action:hover { filter: brightness(1.2); }

    /* Controls Bar */
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; background: var(--card-bg); padding: 1rem; border-radius: 10px; border: 1px solid var(--border); }
    .btn-control { flex: 1; min-width: 100px; padding: 0.75rem; font-size: 0.9rem; }
    .btn-bull { background: var(--shield); color: white; }
    .btn-miss { background: #475569; color: white; }
    .btn-next { background: var(--accent); color: white; }
    .btn-undo { background: #64748b; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎯 ARENA DARTS</h1>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="setup-card">
    <h2>Game Setup</h2>
    <div class="input-group">
      <label>Board Type</label>
      <select id="board-type">
        <option value="basic">Basic Board (Single, Double, Triple)</option>
        <option value="quad">Quad Board (+ Quad Ring)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Players (Minimum 2)</label>
      <div id="player-inputs" class="player-inputs">
        <div class="player-input-row">
          <input type="text" placeholder="Player 1 Name" class="p-name" value="Player 1">
          <input type="number" placeholder="Target #" class="p-target" min="1" max="20" value="20">
        </div>
        <div class="player-input-row">
          <input type="text" placeholder="Player 2 Name" class="p-name" value="Player 2">
          <input type="number" placeholder="Target #" class="p-target" min="1" max="20" value="19">
        </div>
      </div>
      <button type="button" class="btn-secondary" onclick="addPlayerInput()">+ Add Player</button>
    </div>

    <p style="font-size: 0.85rem; color: var(--subtext); margin-bottom: 1rem;">
      * Weak Hand Target: Each player enters the segment hit during their preliminary weak-hand throw.
    </p>

    <button class="btn-primary" onclick="startGame()">Start Battle</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <div id="healer-banner" class="banner hidden">✨ Healer's Round Active! Hit your target to heal! ✨</div>
    <div id="coins-container" class="coins-container"></div>

    <div id="players-grid" class="players-grid"></div>

    <div class="controls">
      <button class="btn-control btn-miss" onclick="registerThrow('miss')">Miss</button>
      <button class="btn-control btn-bull" onclick="registerThrow('outer_bull')">Outer Bull (+1 Shield)</button>
      <button class="btn-control btn-bull" onclick="registerThrow('dbull')">D-Bull (+3 Shield)</button>
      <button class="btn-control btn-undo" onclick="undo()">Undo</button>
      <button class="btn-control btn-next" onclick="nextTurn()">Next Turn ➔</button>
    </div>
  </div>
</div>

<script>
  let gameState = {
    boardType: 'basic',
    players: [],
    activePlayerIdx: 0,
    isHealersRound: false,
    healerTurnsLeft: 0,
    turnsUntilCoin: Math.floor(Math.random() * 13) + 3,
    activeCoins: [],
    history: []
  };

  function addPlayerInput() {
    const container = document.getElementById('player-inputs');
    const count = container.children.length + 1;
    const div = document.createElement('div');
    div.className = 'player-input-row';
    div.innerHTML = `
      <input type="text" placeholder="Player ${count} Name" class="p-name" value="Player ${count}">
      <input type="number" placeholder="Target #" class="p-target" min="1" max="20" value="${21 - count}">
    `;
    container.appendChild(div);
  }

  function startGame() {
    const names = Array.from(document.querySelectorAll('.p-name')).map(i => i.value.trim());
    const targets = Array.from(document.querySelectorAll('.p-target')).map(i => parseInt(i.value) || 20);
    
    if (names.length < 2) return alert('Need at least 2 players!');

    gameState.boardType = document.getElementById('board-type').value;
    gameState.players = names.map((name, idx) => ({
      id: idx,
      name: name || `Player ${idx + 1}`,
      target: targets[idx],
      hp: 10,
      maxHp: 15,
      shield: 0,
      isAlive: true
    }));

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    render();
  }

  function saveState() {
    gameState.history.push(JSON.parse(JSON.stringify(gameState)));
  }

  function undo() {
    if (gameState.history.length === 0) return;
    const previous = gameState.history.pop();
    // Preserve history array itself when rolling back
    previous.history = gameState.history;
    gameState = previous;
    render();
  }

  function getAliveCount() {
    return gameState.players.filter(p => p.isAlive).length;
  }

  function handleActionThrow() {
    // Decrement powerup coin counters when a physical throw happens
    gameState.turnsUntilCoin--;
    if (gameState.turnsUntilCoin <= 0 && gameState.activeCoins.length < 2) {
      spawnCoin();
      gameState.turnsUntilCoin = Math.floor(Math.random() * 13) + 3;
    }
  }

  function spawnCoin() {
    const segments = Array.from({length: 20}, (_, i) => i + 1).concat(['Outer Bull', 'D-Bull']);
    const targetSeg = segments[Math.floor(Math.random() * segments.length)];
    gameState.activeCoins.push({
      id: Date.now(),
      segment: targetSeg,
      turnsLeft: 2 * getAliveCount()
    });
  }

  function claimCoin(coinId) {
    saveState();
    gameState.activeCoins = gameState.activeCoins.filter(c => c.id !== coinId);
    render();
  }

  function registerThrow(type, targetPlayerId = null, multiplier = 1) {
    saveState();
    handleActionThrow();

    const activePlayer = gameState.players[gameState.activePlayerIdx];

    if (type === 'outer_bull') {
      activePlayer.shield = Math.min(5, activePlayer.shield + 1);
    } else if (type === 'dbull') {
      activePlayer.shield = Math.min(5, activePlayer.shield + 3);
    } else if (type === 'attack') {
      const target = gameState.players.find(p => p.id === targetPlayerId);
      let damage = multiplier;
      
      if (target.shield > 0) {
        if (target.shield >= damage) {
          target.shield -= damage;
          damage = 0;
        } else {
          damage -= target.shield;
          target.shield = 0;
        }
      }
      
      if (damage > 0) {
        target.hp -= damage;
        if (target.hp <= 0) {
          target.hp = 0;
          target.isAlive = false;
        }
      }
    } else if (type === 'heal') {
      activePlayer.hp = Math.min(activePlayer.maxHp, activePlayer.hp + multiplier);
    }

    checkWinCondition();
    render();
  }

  function nextTurn() {
    saveState();

    // Age power-up coins
    gameState.activeCoins.forEach(c => c.turnsLeft--);
    gameState.activeCoins = gameState.activeCoins.filter(c => c.turnsLeft > 0);

    // Advance Healer's Round tracking
    if (gameState.isHealersRound) {
      gameState.healerTurnsLeft--;
      if (gameState.healerTurnsLeft <= 0) {
        gameState.isHealersRound = false;
      }
    } else if (Math.random() < 0.12) { // Random chance to trigger Healer's Round
      gameState.isHealersRound = true;
      gameState.healerTurnsLeft = getAliveCount();
    }

    // Find next alive player
    do {
      gameState.activePlayerIdx = (gameState.activePlayerIdx + 1) % gameState.players.length;
    } while (!gameState.players[gameState.activePlayerIdx].isAlive);

    render();
  }

  function checkWinCondition() {
    const alive = gameState.players.filter(p => p.isAlive);
    if (alive.length === 1) {
      setTimeout(() => alert(`🏆 ${alive[0].name} WINS THE ARENA!`), 10);
    }
  }

  function render() {
    // Healer Banner
    const banner = document.getElementById('healer-banner');
    if (gameState.isHealersRound) banner.classList.remove('hidden');
    else banner.classList.add('hidden');

    // Coins UI
    const coinsDiv = document.getElementById('coins-container');
    coinsDiv.innerHTML = '';
    gameState.activeCoins.forEach(coin => {
      const cEl = document.createElement('div');
      cEl.className = 'coin';
      cEl.innerHTML = `🪙 Hit <strong>${coin.segment}</strong><br><small>Expires in ${coin.turnsLeft} turns (Tap to Claim)</small>`;
      cEl.onclick = () => claimCoin(coin.id);
      coinsDiv.appendChild(cEl);
    });

    // Players UI
    const grid = document.getElementById('players-grid');
    grid.innerHTML = '';

    gameState.players.forEach((p) => {
      const isActive = p.id === gameState.players[gameState.activePlayerIdx].id;
      const isLowHp = p.hp <= 3 && p.isAlive;
      const hasQuad = gameState.boardType === 'quad';

      const card = document.createElement('div');
      card.className = `player-card ${isLowHp ? 'low-hp' : ''} ${isActive ? 'active-turn' : ''} ${!p.isAlive ? 'eliminated' : ''}`;

      let actionButtonsHtml = '';

      if (p.isAlive) {
        if (isActive && gameState.isHealersRound) {
          actionButtonsHtml = `
            <div style="margin-top:0.5rem; text-align:center; font-size:0.8rem; color:var(--heal);">Self Heal Options:</div>
            <div class="actions-grid ${hasQuad ? 'has-quad' : ''}">
              <button class="btn-action" style="background:var(--heal); color:black;" onclick="registerThrow('heal', ${p.id}, 1)">+1 Single</button>
              <button class="btn-action" style="background:var(--heal); color:black;" onclick="registerThrow('heal', ${p.id}, 2)">+2 Double</button>
              <button class="btn-action" style="background:var(--heal); color:black;" onclick="registerThrow('heal', ${p.id}, 3)">+3 Triple</button>
              ${hasQuad ? `<button class="btn-action" style="background:var(--heal); color:black;" onclick="registerThrow('heal', ${p.id}, 4)">+4 Quad</button>` : ''}
            </div>
          `;
        } else if (!isActive) {
          actionButtonsHtml = `
            <div class="actions-grid ${hasQuad ? 'has-quad' : ''}">
              <button class="btn-action" onclick="registerThrow('attack', ${p.id}, 1)">Single (-1)</button>
              <button class="btn-action" onclick="registerThrow('attack', ${p.id}, 2)">Double (-2)</button>
              <button class="btn-action" onclick="registerThrow('attack', ${p.id}, 3)">Triple (-3)</button>
              ${hasQuad ? `<button class="btn-action" onclick="registerThrow('attack', ${p.id}, 4)">Quad (-4)</button>` : ''}
            </div>
          `;
        }
      }

      card.innerHTML = `
        ${isActive ? '<span class="badge">TURN</span>' : ''}
        <h3>${p.name}</h3>
        <div class="target-num">Target Segment: <strong>${p.target}</strong></div>
        <div class="stats">
          <span class="hp">❤️ HP: ${p.hp}/${p.maxHp}</span>
          <span class="shield">🛡️ Shield: ${p.shield}/5</span>
        </div>
        ${actionButtonsHtml}
      `;
      grid.appendChild(card);
    });
  }
</script>
</body>
</html>
